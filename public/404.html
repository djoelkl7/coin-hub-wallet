<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Coinbase Wallet Portal</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #07090e;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background: #0d121c;
        border: 1px solid #1f293d;
        border-radius: 16px;
        padding: 36px 32px;
        max-width: 440px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .badge {
        display: inline-block;
        font-family: monospace;
        font-size: 12px;
        color: #38bdf8;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.3);
        padding: 4px 10px;
        border-radius: 9999px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 12px 20px;
        background: #0052ff;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        border-radius: 10px;
        transition: background 0.15s ease;
      }
      .btn:hover {
        background: #0045d8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">HTTP 404 NOT FOUND</span>
      <h1>Resource Not Found</h1>
      <p>The requested route or resource does not exist or directory listing is protected.</p>
      <a href="/" class="btn">Return to Coinbase Wallet Portal</a>
    </div>
  </body>
</html>
